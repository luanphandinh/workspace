<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 850" role="img" aria-labelledby="title desc">
  <title id="title">Invite commit and notification retry</title>
  <desc id="desc">Friendship is checked before a transaction atomically stores pending membership and its outbox event. The worker delivers after commit and retries the same event ID after an uncertain acknowledgement.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#475569"/></marker></defs>
  <rect width="900" height="850" fill="#ffffff"/>
  <g font-family="sans-serif" fill="#0f172a" font-size="14">
    <text x="30" y="35" font-size="22" font-weight="bold">Invite → commit → deliver / retry</text>
    <g fill="#f1f5f9" stroke="#64748b">
      <rect x="28" y="60" width="135" height="60" rx="8"/>
      <rect x="188" y="60" width="140" height="60" rx="8"/>
      <rect x="348" y="60" width="140" height="60" rx="8"/>
      <rect x="508" y="60" width="150" height="60" rx="8"/>
      <rect x="688" y="60" width="183" height="60" rx="8"/>
    </g>
    <text x="95" y="94" text-anchor="middle">CollectionService</text>
    <text x="258" y="94" text-anchor="middle">FriendService</text>
    <text x="418" y="94" text-anchor="middle">PostgreSQL</text>
    <text x="583" y="94" text-anchor="middle">InvitationWorker</text>
    <text x="779" y="94" text-anchor="middle">NotificationService</text>
    <g stroke="#94a3b8" stroke-dasharray="5 5"><path d="M95 120 V825"/><path d="M258 120 V825"/><path d="M418 120 V825"/><path d="M583 120 V825"/><path d="M779 120 V825"/></g>
    <text x="30" y="145">PUT /v1/collections/{id}/</text>
    <text x="30" y="163">members/{user_id}</text>
    <path d="M95 194 H258" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="30" y="182">HTTP: FriendService.AreFriends</text>
    <path d="M258 230 H95" stroke="#475569" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
    <text x="150" y="218">friends=true</text>
    <rect x="38" y="257" width="445" height="233" rx="8" fill="#f0fdf4" stroke="#16a34a"/>
    <text x="52" y="282" fill="#166534" font-weight="bold">TX · lock collection; validate owner</text>
    <path d="M95 330 H418" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="110" y="313">SQL: UPSERT collection_members</text>
    <text x="110" y="352">pending + version · no-op on retry</text>
    <path d="M95 401 H418" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="110" y="386">SQL: INSERT invitation_outbox</text>
    <text x="110" y="423">Only for a new pending version</text>
    <path d="M418 467 H95" stroke="#16a34a" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
    <text x="170" y="453">COMMIT · then HTTP 200</text>
    <path d="M583 538 H418" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="460" y="509">SQL: SELECT invitation_outbox</text>
    <text x="460" y="528">FOR UPDATE SKIP LOCKED + lease</text>
    <path d="M418 577 H583" stroke="#475569" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
    <text x="442" y="563">COMMIT · persisted event_id</text>
    <path d="M583 623 H779" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="500" y="608">HTTP: SendInvitation(event_id)</text>
    <rect x="502" y="650" width="365" height="125" rx="8" fill="#fff7ed" stroke="#ea580c"/>
    <text x="515" y="675" font-weight="bold">Timeout / crash before marking delivered</text>
    <path d="M583 721 H779" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="515" y="704">Retry the same event_id</text>
    <text x="515" y="752">NotificationService returns prior result</text>
    <path d="M583 811 H418" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="440" y="795">SQL: MarkDelivered after success</text>
  </g>
</svg>
