<svg xmlns="http://www.w3.org/2000/svg" width="800" height="580" viewBox="0 0 800 580" role="img" aria-labelledby="title description">
  <title id="title">Remote development</title>
  <desc id="description">Local Neovide connects directly to remote Neovim over SSH and RPC. The local tunnel connects directly to remote tunnel commands using reverse SSH forwarding. Remote tmux hosts Neovim, which runs mcodex connected to the Codex app-server.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
    <style>
      text { font-family: sans-serif; font-size: 16px; fill: #333; text-anchor: middle; }
      .machine { fill: #ffffde; stroke: #aaaa33; }
      .component { fill: #ececff; stroke: #9370db; }
      .connection { fill: none; stroke: #333; stroke-width: 1.5; marker-end: url(#arrow); }
      .both { marker-start: url(#arrow); }
      .label { font-size: 14px; }
    </style>
  </defs>

  <rect class="machine" x="12" y="12" width="250" height="556"/>
  <rect class="machine" x="490" y="12" width="298" height="556"/>
  <text x="137" y="37">Local machine</text>
  <text x="639" y="37">Remote machine</text>
  <rect class="component" x="65" y="135" width="144" height="44"/>
  <text x="137" y="162">Neovide</text>
  <rect class="component" x="65" y="265" width="144" height="50"/>
  <text x="137" y="295">tunnel connect</text>
  <rect class="component" x="65" y="475" width="144" height="52"/>
  <text x="137" y="497">Browser /</text>
  <text x="137" y="516">clipboard</text>
  <rect class="component" x="580" y="55" width="110" height="40"/>
  <text x="635" y="80">tmux</text>
  <rect class="component" x="580" y="135" width="110" height="44"/>
  <text x="635" y="162">nvim</text>
  <rect class="component" x="554" y="265" width="162" height="50"/>
  <text x="635" y="285">tunnel</text>
  <text x="635" y="304">open / paste</text>
  <rect class="component" x="580" y="365" width="110" height="44"/>
  <text x="635" y="392">mcodex</text>
  <rect class="component" x="552" y="475" width="166" height="52"/>
  <text x="635" y="497">Codex</text>
  <text x="635" y="516">app-server</text>

  <path class="connection both" d="M 209 157 H 580"/>
  <text class="label" x="380" y="123">neovide-client</text>
  <text class="label" x="380" y="143">SSH / RPC</text>
  <path class="connection both" d="M 209 290 H 554"/>
  <text class="label" x="380" y="256">reverse SSH</text>
  <text class="label" x="380" y="276">forwarding</text>
  <path class="connection both" d="M 137 315 V 475"/>
  <text class="label" x="203" y="389">URLs /</text>
  <text class="label" x="203" y="409">clipboard</text>
  <path class="connection" stroke-dasharray="4 4" d="M 635 95 V 135"/>
  <text class="label" x="550" y="119">neovide-server</text>
  <path class="connection both" d="M 635 179 V 265"/>
  <text class="label" x="701" y="216">URLs /</text>
  <text class="label" x="701" y="236">clipboard</text>
  <path class="connection" d="M 690 157 H 760 V 387 H 690"/>
  <text class="label" x="715" y="341">terminal</text>
  <text class="label" x="715" y="359">buffer</text>
  <path class="connection both" d="M 635 409 V 475"/>
  <text class="label" x="701" y="437">Unix</text>
  <text class="label" x="701" y="457">socket</text>
</svg>
