<svg xmlns="http://www.w3.org/2000/svg" width="880" height="586" viewBox="0 0 880 586" role="img" aria-labelledby="title description">
  <title id="title">Neovim agent and terminal architecture</title>
  <desc id="description">Neovide connects to Neovim over RPC. The shared view_container draws both panels. Agent plugins run Codex, Cursor, and Claude in the luanphan-agents tmux server. The floating terminal displays panes from the default tmux server. Codex connects to a shared app-server over a Unix socket.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555b67"/>
    </marker>
    <style>
      text { font-family: system-ui, sans-serif; font-size: 16px; fill: #1f2937; text-anchor: middle; }
      .heading { font-weight: 650; }
      .detail { font-size: 13px; fill: #414956; }
      .layer { fill: #f5f7fb; stroke: #adb6c8; }
      .component { fill: #ffffff; stroke: #adb6c8; }
      .shared { fill: #e8eefc; stroke: #7893cd; }
      .agent { fill: #efe9fb; stroke: #a18bc9; }
      .terminal { fill: #e5f4ef; stroke: #75a999; }
      .link { fill: none; stroke: #555b67; stroke-width: 1.5; marker-end: url(#arrow); }
      .both { marker-start: url(#arrow); }
    </style>
  </defs>

  <rect x="1" y="1" width="878" height="584" rx="12" fill="#fcfcfd" stroke="#d3d8e0"/>
  <rect class="component" x="342" y="16" width="196" height="42" rx="8"/>
  <text class="heading" x="440" y="43">Neovide</text>

  <rect class="layer" x="28" y="86" width="824" height="243" rx="10"/>
  <text class="heading" x="87" y="113">Neovim</text>
  <path class="link both" d="M 440 59 V 119"/>
  <text class="detail" x="490" y="77">Neovim RPC</text>

  <rect class="shared" x="53" y="120" width="774" height="56" rx="8"/>
  <text class="heading" x="440" y="143">view_container</text>
  <text class="detail" x="440" y="163">Window bar · tabs and tiles · shared editor tile</text>

  <path class="link" d="M 289 176 V 195"/>
  <path class="link" d="M 690 176 V 195"/>
  <rect class="agent" x="53" y="196" width="472" height="54" rx="8"/>
  <text class="heading" x="289" y="218">Agents · &lt;leader&gt;a</text>
  <text class="detail" x="289" y="237">Codex, Cursor, and Claude plugins</text>
  <rect class="terminal" x="553" y="196" width="274" height="54" rx="8"/>
  <text class="heading" x="690" y="218">Floating terminal · &lt;leader&gt;t</text>
  <text class="detail" x="690" y="237">Global tmux sessions and panes</text>

  <path class="link" d="M 289 250 V 269"/>
  <path class="link" d="M 690 250 V 269"/>
  <rect class="shared" x="53" y="270" width="774" height="43" rx="8"/>
  <text class="heading" x="440" y="297">Shared tmux transport</text>

  <path class="link both" d="M 289 314 V 365"/>
  <path class="link both" d="M 690 314 V 365"/>
  <text class="detail" x="364" y="350">tmux control mode</text>
  <text class="detail" x="765" y="350">tmux control mode</text>

  <rect class="agent" x="53" y="366" width="472" height="55" rx="8"/>
  <text class="heading" x="289" y="389">luanphan-agents tmux server</text>
  <text class="detail" x="289" y="408">One tmux session per workspace</text>
  <rect class="terminal" x="553" y="366" width="274" height="55" rx="8"/>
  <text class="heading" x="690" y="389">Default tmux server</text>
  <text class="detail" x="690" y="408">Reuses a session or creates one</text>

  <path class="link" d="M 289 421 V 460"/>
  <path class="link" d="M 289 440 H 127 V 460"/>
  <path class="link" d="M 289 440 H 451 V 460"/>
  <path class="link" d="M 690 421 V 460"/>
  <rect class="component" x="53" y="461" width="148" height="42" rx="8"/>
  <text x="127" y="487">Codex via mcodex</text>
  <rect class="component" x="215" y="461" width="148" height="42" rx="8"/>
  <text x="289" y="487">cursor-agent</text>
  <rect class="component" x="377" y="461" width="148" height="42" rx="8"/>
  <text x="451" y="487">claude</text>
  <rect class="component" x="553" y="461" width="274" height="42" rx="8"/>
  <text x="690" y="487">Shells and other terminal jobs</text>
  <path class="link both" d="M 127 504 V 540"/>
  <text class="detail" x="174" y="526">Unix socket</text>
  <rect class="component" x="53" y="541" width="245" height="32" rx="8"/>
  <text x="175" y="562">Shared Codex app-server</text>
</svg>
